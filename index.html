<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikaye Oyunu</title>

<style>
body{
margin:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
color:white;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
display:none;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ff0033;
color:white;
cursor:pointer;
margin-top:15px;
}

#ilerle,#devam2,#devam3{display:none;}

#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
opacity:0;
transition:1s;
}

/* yazı animasyonu */
#yazi{
display:none;
font-size:40px;
text-align:center;
opacity:0;
transform:translateY(50px);
transition:1s;
color:#00ffcc;
text-shadow:0 0 20px #00ffcc;
}

/* hafıza oyunu */
#oyun{
display:none;
grid-template-columns: repeat(5, 80px);
grid-gap:10px;
}

.kart{
width:80px;
height:80px;
background:#222;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.kart img{
width:100%;
height:100%;
display:none;
}
</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>
<video id="video"></video>
<button id="ilerle" onclick="ilerle()">İlerle</button>

<div id="yazi">YOL BOZULDU<br>YOLU ONAR</div>
<button id="devam2" onclick="yaziDevam()">Devam Et</button>

<div id="oyun"></div>
<button id="devam3" onclick="oyunBaslat()">Oyuna Başla</button>

<script>

let video = document.getElementById("video");
let baslat = document.getElementById("baslat");
let ilerleBtn = document.getElementById("ilerle");
let fade = document.getElementById("fade");
let yazi = document.getElementById("yazi");
let devam2 = document.getElementById("devam2");
let oyun = document.getElementById("oyun");

let sahne = 1;

baslat.onclick = function(){
baslat.style.display="none";
video.style.display="block";
video.src="1.mp4";
video.play();
}

video.onended = function(){

if(sahne == 1){
ilerleBtn.style.display="block";
}

else if(sahne == 2){
ilerleBtn.innerText="Şifreyi Kır";
ilerleBtn.style.display="block";
}

else if(sahne == 3){
devam2.style.display="block";
}

}

function ilerle(){
fade.style.opacity="1";

setTimeout(()=>{

if(sahne==1){
video.src="2.mp4";
video.play();
sahne=2;
}

else if(sahne==2){
video.src="3.mp4";
video.play();
sahne=3;
}

fade.style.opacity="0";

},1000);
}

/* YAZI SAHNESİ */
devam2.onclick = function(){
devam2.style.display="none";
video.style.display="none";

yazi.style.display="block";

setTimeout(()=>{
yazi.style.opacity="1";
yazi.style.transform="translateY(0)";
},100);

setTimeout(()=>{
devam3.style.display="block";
},2000);
}

let devam3 = document.getElementById("devam3");

function yaziDevam(){}

/* OYUN */
devam3.onclick = function(){
yazi.style.display="none";
devam3.style.display="none";
oyun.style.display="grid";

kartlariOlustur();
}

let secilen = [];
let kilit = false;

function kartlariOlustur(){

let resimler = [];
for(let i=1;i<=10;i++){
resimler.push(i+".png");
resimler.push(i+".png");
}

resimler.sort(()=>Math.random()-0.5);

resimler.forEach(src=>{
let kart = document.createElement("div");
kart.className="kart";

let img = document.createElement("img");
img.src = src;

kart.appendChild(img);

kart.onclick = function(){

if(kilit || img.style.display=="block") return;

img.style.display="block";
secilen.push({kart,img});

if(secilen.length==2){
kilit=true;

if(secilen[0].img.src == secilen[1].img.src){
secilen=[];
kilit=false;
}
else{
setTimeout(()=>{
secilen[0].img.style.display="none";
secilen[1].img.style.display="none";
secilen=[];
kilit=false;
},800);
}
}

}

oyun.appendChild(kart);
});
}

</script>

</body>
</html>

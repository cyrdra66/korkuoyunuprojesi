<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikaye Oyunu</title>

<style>
body{
margin:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
color:white;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
display:none;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ff0033;
color:white;
cursor:pointer;
margin-top:15px;
}

#fade{
position:fixed;
width:100%;
height:100%;
background:black;
opacity:0;
transition:1s;
}

#ilerle,#devam,#yaziDevam{display:none}

#sifreEkrani{display:none;flex-direction:column;gap:10px}
#sonuc{color:#00ffcc}

#yaziEkrani{display:none;text-align:center;font-size:28px}

#oyun{
display:none;
grid-template-columns:repeat(5,80px);
gap:10px;
}

.kart{
width:80px;
height:80px;
background:#222;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
border-radius:10px;
}

.kart img{
width:100%;
height:100%;
display:none;
border-radius:10px;
}

.acik img{display:block}
</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>
<video id="video" muted playsinline></video>
<button id="ilerle">İlerle</button>

<div id="sifreEkrani">
<input id="tahmin" placeholder="3 haneli">
<button id="dene">Dene</button>
<div id="sonuc"></div>
<button id="devam">Devam Et</button>
</div>

<div id="yaziEkrani">
<p id="yazi"></p>
<button id="yaziDevam">Devam Et</button>
</div>

<div id="oyun"></div>

<script>

// ELEMENTLER
const baslat = document.getElementById("baslat");
const video = document.getElementById("video");
const ilerle = document.getElementById("ilerle");
const fade = document.getElementById("fade");

const sifreEkrani = document.getElementById("sifreEkrani");
const sonuc = document.getElementById("sonuc");
const devam = document.getElementById("devam");
const dene = document.getElementById("dene");

const yaziEkrani = document.getElementById("yaziEkrani");
const yazi = document.getElementById("yazi");
const yaziDevam = document.getElementById("yaziDevam");

const oyun = document.getElementById("oyun");

// DURUM
let sahne = 1;
let sifre = Math.floor(100 + Math.random()*900);

// BAŞLAT
baslat.onclick = ()=>{
baslat.style.display="none";
video.style.display="block";
video.src="1.mp4";
video.play();
}

// VİDEO BİTİNCE
video.onended = ()=>{
if(sahne==1){
ilerle.innerText="İlerle";
ilerle.style.display="block";
}
else if(sahne==2){
ilerle.innerText="Şifreyi Kır";
ilerle.style.display="block";
}
else if(sahne==3){
ilerle.innerText="Devam Et";
ilerle.style.display="block";
}
}

// İLERLE
ilerle.onclick = ()=>{

fade.style.opacity=1;

setTimeout(()=>{

if(sahne==1){
video.src="2.mp4";
video.play();
sahne=2;
}

else if(sahne==2){
video.style.display="none";
ilerle.style.display="none";
sifreEkrani.style.display="flex";
}

else if(sahne==3){
video.style.display="none";
ilerle.style.display="none";
yaziAnimasyonu();
}

fade.style.opacity=0;

},800);
}

// ŞİFRE
dene.onclick = ()=>{

let t = Number(document.getElementById("tahmin").value);

if(!t) return;

if(t > sifre) sonuc.innerText="Daha küçük";
else if(t < sifre) sonuc.innerText="Daha büyük";
else{
sonuc.innerText="Şifre Kırıldı!";
devam.style.display="block";
}
}

// 3. VİDEO
devam.onclick = ()=>{

fade.style.opacity=1;

setTimeout(()=>{
sifreEkrani.style.display="none";
video.style.display="block";
video.src="3.mp4";
video.play();
sahne=3;
fade.style.opacity=0;
},800);

}

// YAZI ANİMASYONU
function yaziAnimasyonu(){

yaziEkrani.style.display="block";
yazi.innerText="";
yaziDevam.style.display="none";

let text="Yol bozuldu yolu onar...";
let i=0;

let interval=setInterval(()=>{
yazi.innerText += text[i];
i++;

if(i>=text.length){
clearInterval(interval);
yaziDevam.style.display="block";
}
},50);

}

// OYUNA GEÇ
yaziDevam.onclick = ()=>{
yaziEkrani.style.display="none";
oyun.style.display="grid";
oyun.innerHTML="";
hafiza();
}

// HAFIZA OYUNU
function hafiza(){

let kartlar=[];
for(let i=1;i<=10;i++){
kartlar.push(i);
kartlar.push(i);
}

kartlar.sort(()=>Math.random()-0.5);

let secilen=[];

kartlar.forEach(num=>{

let div=document.createElement("div");
div.className="kart";

let img=document.createElement("img");
img.src = num + ".png";

div.appendChild(img);

div.onclick = ()=>{

if(div.classList.contains("acik")) return;

div.classList.add("acik");
secilen.push(div);

if(secilen.length==2){

if(secilen[0].innerHTML !== secilen[1].innerHTML){

setTimeout(()=>{
secilen[0].classList.remove("acik");
secilen[1].classList.remove("acik");
secilen=[];
},600);

}else{
secilen=[];
}

}

};

oyun.appendChild(div);

});

}

</script>

</body>
</html>

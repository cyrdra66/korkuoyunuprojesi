<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hikaye Oyunu</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
color:white;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
display:none;
pointer-events:none;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ff0033;
color:white;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#cc0029;
}

#ilerle{
display:none;
}

/* KARARMA */
#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
opacity:0;
pointer-events:none;
transition:opacity 1s;
}

/* ŞİFRE EKRANI */
#sifreEkrani{
display:none;
flex-direction:column;
align-items:center;
gap:15px;
}

input{
padding:15px;
font-size:22px;
border-radius:10px;
border:none;
text-align:center;
width:200px;
background:black;
color:#00ffcc;
box-shadow:0 0 15px #00ffcc;
}

#sonuc{
font-size:18px;
color:#00ffcc;
text-shadow:0 0 10px #00ffcc;
}

</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>

<video id="video">
<source src="1.mp4" type="video/mp4">
</video>

<button id="ilerle" onclick="ilerle()">İlerle</button>

<!-- ŞİFRE OYUNU -->
<div id="sifreEkrani">
<h2>Şifreyi Kır 🔐</h2>
<input type="number" id="tahmin" placeholder="3 haneli gir">
<button onclick="kontrol()">Dene</button>
<div id="sonuc"></div>
</div>

<script>

let video = document.getElementById("video");
let baslat = document.getElementById("baslat");
let ilerleBtn = document.getElementById("ilerle");
let fade = document.getElementById("fade");

let sifreEkrani = document.getElementById("sifreEkrani");
let sonuc = document.getElementById("sonuc");

let sahne = 1;

// random 3 haneli şifre
let sifre = Math.floor(100 + Math.random() * 900);

baslat.onclick = function(){
baslat.style.display="none";
video.style.display="block";
video.src="1.mp4";
video.play();
}

video.onended = function(){

if(sahne == 1){
ilerleBtn.innerText="İlerle";
ilerleBtn.style.display="block";
}

if(sahne == 2){
ilerleBtn.innerText="Şifreyi Kır";
ilerleBtn.style.display="block";
}

}

function ilerle(){

fade.style.opacity = "1";

setTimeout(function(){

if(sahne == 1){
video.src="2.mp4";
video.play();
sahne = 2;
}

else if(sahne == 2){

video.style.display="none";
ilerleBtn.style.display="none";
sifreEkrani.style.display="flex";

}

setTimeout(function(){
fade.style.opacity="0";
},100);

},1000);

}

// ŞİFRE KONTROL
function kontrol(){

let tahmin = Number(document.getElementById("tahmin").value);

if(!tahmin) return;

if(tahmin > sifre){
sonuc.innerText = "Daha küçük gir 🔽";
}
else if(tahmin < sifre){
sonuc.innerText = "Daha büyük gir 🔼";
}
else{
sonuc.innerText = "Şifre Kırıldı! 🎉";
sonuc.style.color = "#00ff00";
}

}

// sağ tık kapatma
document.addEventListener("contextmenu", e => e.preventDefault());

</script>

</body>
</html>

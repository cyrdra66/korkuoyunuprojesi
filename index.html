<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikaye Oyunu</title>

<style>
body{
margin:0;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
display:none;
}

button{
padding:15px 30px;
margin-top:10px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

#ilerle{display:none}
#devam{display:none}

#fade{
position:fixed;
width:100%;
height:100%;
background:black;
opacity:0;
transition:1s;
}

/* şifre */
#sifreEkrani{display:none;flex-direction:column}
#sonuc{margin-top:10px}

/* yazı */
#yaziEkrani{display:none;text-align:center}
#yaziDevam{display:none}

/* oyun */
#oyun{
display:none;
grid-template-columns:repeat(5,80px);
gap:10px;
}

.kart{
width:80px;
height:80px;
background:#333;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.kart img{
width:100%;
height:100%;
display:none;
}

.acik img{display:block}
</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>
<video id="video"></video>
<button id="ilerle">İlerle</button>

<div id="sifreEkrani">
<input id="tahmin" placeholder="3 haneli">
<button onclick="kontrol()">Dene</button>
<div id="sonuc"></div>
<button id="devam">Devam Et</button>
</div>

<div id="yaziEkrani">
<p id="yazi"></p>
<button id="yaziDevam">Devam Et</button>
</div>

<div id="oyun"></div>

<script>

let baslat = document.getElementById("baslat");
let video = document.getElementById("video");
let ilerle = document.getElementById("ilerle");
let fade = document.getElementById("fade");

let sifreEkrani = document.getElementById("sifreEkrani");
let sonuc = document.getElementById("sonuc");
let devam = document.getElementById("devam");

let yaziEkrani = document.getElementById("yaziEkrani");
let yazi = document.getElementById("yazi");
let yaziDevam = document.getElementById("yaziDevam");

let oyun = document.getElementById("oyun");

let sahne = 1;
let sifre = Math.floor(100 + Math.random()*900);

// başlat
baslat.onclick = ()=>{
baslat.style.display="none";
video.style.display="block";
video.src="1.mp4";
video.play();
}

// video bitince
video.onended = ()=>{

if(sahne==1){
ilerle.style.display="block";
ilerle.innerText="İlerle";
}

else if(sahne==2){
ilerle.style.display="block";
ilerle.innerText="Şifreyi Kır";
}

else if(sahne==3){
ilerle.style.display="block";
ilerle.innerText="Devam Et";
}

}

// ilerle
ilerle.onclick = ()=>{

fade.style.opacity=1;

setTimeout(()=>{

if(sahne==1){
video.src="2.mp4";
video.play();
sahne=2;
}

else if(sahne==2){
video.style.display="none";
ilerle.style.display="none";
sifreEkrani.style.display="flex";
}

else if(sahne==3){
video.style.display="none";
ilerle.style.display="none";
yaziAnimasyon();
}

fade.style.opacity=0;

},800);
}

// şifre
function kontrol(){

let t = Number(tahmin.value);

if(t > sifre) sonuc.innerText="Daha küçük";
else if(t < sifre) sonuc.innerText="Daha büyük";
else{
sonuc.innerText="Doğru!";
devam.style.display="block";
}
}

// 3.mp4
devam.onclick = ()=>{

fade.style.opacity=1;

setTimeout(()=>{

sifreEkrani.style.display="none";
video.style.display="block";
video.src="3.mp4";
video.play();
sahne=3;

fade.style.opacity=0;

},800);
}

// yazı animasyon
function yaziAnimasyon(){

yaziEkrani.style.display="block";
yazi.innerText="";
yaziDevam.style.display="none";

let text="Yol bozuldu yolu onar...";
let i=0;

let inter=setInterval(()=>{
yazi.innerText += text[i];
i++;

if(i>=text.length){
clearInterval(inter);
yaziDevam.style.display="block";
}

},50);
}

// oyuna geç
yaziDevam.onclick = ()=>{

yaziEkrani.style.display="none";
oyun.style.display="grid";
oyun.innerHTML="";
hafiza();

}

// hafıza oyunu
function hafiza(){

let kartlar=[];

for(let i=1;i<=10;i++){
kartlar.push(i);
kartlar.push(i);
}

kartlar.sort(()=>Math.random()-0.5);

let secilen=[];

kartlar.forEach(num=>{

let kart=document.createElement("div");
kart.className="kart";

let img=document.createElement("img");
img.src=num+".png";

kart.appendChild(img);

kart.onclick=()=>{

if(kart.classList.contains("acik")) return;

kart.classList.add("acik");
secilen.push(kart);

if(secilen.length==2){

if(secilen[0].innerHTML !== secilen[1].innerHTML){

setTimeout(()=>{
secilen[0].classList.remove("acik");
secilen[1].classList.remove("acik");
secilen=[];
},600);

}else{
secilen=[];
}

}

};

oyun.appendChild(kart);

});

}

</script>

</body>
</html>

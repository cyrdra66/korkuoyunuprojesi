<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hikaye Oyunu</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
color:white;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
display:none;
pointer-events:none;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ff0033;
color:white;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#cc0029;
}

#ilerle{
display:none;
}

/* KARARMA EFEKTI */

#fade{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
opacity:0;
pointer-events:none;
transition:opacity 1s;
}

</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>

<video id="video">
<source src="1.mp4" type="video/mp4">
</video>

<button id="ilerle" onclick="ilerle()">İlerle</button>

<script>

let video = document.getElementById("video");
let baslat = document.getElementById("baslat");
let ilerleBtn = document.getElementById("ilerle");
let fade = document.getElementById("fade");

let sahne = 1;

baslat.onclick = function(){

baslat.style.display="none";
video.style.display="block";

video.src="1.mp4";
video.play();

}

// video bitince
video.onended = function(){

if(sahne == 1){
ilerleBtn.innerText="İlerle";
ilerleBtn.style.display="block";
}

if(sahne == 2){
ilerleBtn.innerText="Şifreyi Çöz";
ilerleBtn.style.display="block";
}

}

function ilerle(){

// ekran kararsın
fade.style.opacity = "1";

setTimeout(function(){

if(sahne == 1){

video.src="2.mp4";
video.play();
sahne = 2;

}

else if(sahne == 2){

alert("Şifre ekranı buraya gelecek");

}

ilerleBtn.style.display="none";

// ekran tekrar açılsın
setTimeout(function(){
fade.style.opacity="0";
},100);

},1000);

}

// sağ tık kapatma
document.addEventListener("contextmenu", e => e.preventDefault());

</script>

</body>
</html>

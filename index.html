<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikaye Oyunu</title>

<style>

body{
margin:0;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
color:white;
overflow:hidden;
}

video{
width:95%;
max-width:900px;
border-radius:10px;
display:none;
pointer-events:none;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ff0033;
color:white;
cursor:pointer;
margin-top:15px;
}

#fade{
position:fixed;
width:100%;
height:100%;
background:black;
opacity:0;
transition:1s;
}

/* ŞİFRE */
#sifreEkrani{display:none;flex-direction:column;gap:10px}
#sonuc{color:#00ffcc}

/* DEVAM */
#devam{display:none}

/* YAZI EKRANI */
#yaziEkrani{
display:none;
font-size:30px;
text-align:center;
animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}

/* HAFIZA OYUNU */
#oyun{
display:none;
grid-template-columns:repeat(5,80px);
gap:10px;
}

.kart{
width:80px;
height:80px;
background:#222;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
cursor:pointer;
border-radius:10px;
}

.kart img{
width:100%;
height:100%;
display:none;
border-radius:10px;
}

.acik img{display:block}

</style>
</head>

<body>

<div id="fade"></div>

<button id="baslat">Başlat</button>
<video id="video"></video>
<button id="ilerle" onclick="ilerle()" style="display:none">İlerle</button>

<!-- ŞİFRE -->
<div id="sifreEkrani">
<input id="tahmin" placeholder="3 haneli">
<button onclick="kontrol()">Dene</button>
<div id="sonuc"></div>
<button id="devam" onclick="devamEt()">Devam Et</button>
</div>

<!-- YAZI -->
<div id="yaziEkrani">
<p id="yazi"></p>
<button id="yaziDevam" onclick="oyunaGec()" style="display:none">Devam Et</button>
</div>

<!-- OYUN -->
<div id="oyun"></div>

<script>

let video = document.getElementById("video");
let fade = document.getElementById("fade");
let ilerleBtn = document.getElementById("ilerle");

let sahne = 1;
let sifre = Math.floor(100 + Math.random()*900);

// BAŞLAT
baslat.onclick=()=>{
baslat.style.display="none";
video.style.display="block";
video.src="1.mp4";
video.play();
}

// VIDEO BİTTİ
video.onended=()=>{

if(sahne==1){
ilerleBtn.style.display="block";
}

else if(sahne==2){
ilerleBtn.innerText="Şifreyi Kır";
ilerleBtn.style.display="block";
}

else if(sahne==3){
ilerleBtn.innerText="Devam Et";
ilerleBtn.style.display="block";
}

}

// İLERLE
function ilerle(){

fade.style.opacity=1;

setTimeout(()=>{

if(sahne==1){
video.src="2.mp4";
video.play();
sahne=2;
}

else if(sahne==2){
video.style.display="none";
ilerleBtn.style.display="none";
sifreEkrani.style.display="flex";
}

else if(sahne==3){
video.style.display="none";
ilerleBtn.style.display="none";
yaziAnimasyonu();
}

fade.style.opacity=0;

},1000);
}

// ŞİFRE
function kontrol(){

let t = Number(tahmin.value);

if(t>sifre) sonuc.innerText="Daha küçük";
else if(t<sifre) sonuc.innerText="Daha büyük";
else{
sonuc.innerText="Doğru!";
devam.style.display="block";
}
}

// 3. VİDEO
function devamEt(){

fade.style.opacity=1;

setTimeout(()=>{

sifreEkrani.style.display="none";
video.style.display="block";
video.src="3.mp4";
video.play();
sahne=3;

fade.style.opacity=0;

},1000);

}

// YAZI ANİMASYONU
function yaziAnimasyonu(){

yaziEkrani.style.display="block";
let text="Yol bozuldu yolu onar...";
let i=0;

let interval=setInterval(()=>{

yazi.innerText+=text[i];
i++;

if(i>=text.length){
clearInterval(interval);
yaziDevam.style.display="block";
}

},50);

}

// OYUNA GEÇ
function oyunaGec(){

yaziEkrani.style.display="none";
oyun.style.display="grid";
hafizaOyunu();

}

// HAFIZA OYUNU
function hafizaOyunu(){

let kartlar=[];
for(let i=1;i<=10;i++){
kartlar.push(i);
kartlar.push(i);
}

// karıştır
kartlar.sort(()=>Math.random()-0.5);

let secilen=[];

kartlar.forEach(num=>{

let div=document.createElement("div");
div.className="kart";

let img=document.createElement("img");
img.src=num+".png";

div.appendChild(img);

div.onclick=()=>{

if(div.classList.contains("acik")) return;

div.classList.add("acik");
secilen.push(div);

if(secilen.length==2){

if(secilen[0].innerHTML!=secilen[1].innerHTML){

setTimeout(()=>{
secilen[0].classList.remove("acik");
secilen[1].classList.remove("acik");
secilen=[];
},700);

}else{
secilen=[];
}

}

}

oyun.appendChild(div);

});

}

</script>

</body>
</html>
